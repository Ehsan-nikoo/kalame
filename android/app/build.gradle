apply plugin: 'com.android.application'

// کلید عمومی فروشگاه: اول از متغیر محیطی (Secrets گیت‌هاب)، بعد از gradle.properties
def storeKey(String env, String prop) {
    def v = System.getenv(env) ?: (project.findProperty(prop) ?: "")
    return v.toString().replaceAll("\\s", "")
}

android {
    namespace = "com.kalame.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kalame.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // شماره‌ی نسخه هر بار که گیت‌هاب APK می‌سازد یکی بالا می‌رود
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer)
        versionName "0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // امضای ثابت اپ، تا هر نسخه‌ی جدید روی نسخه‌ی قبلی نصب شود و پیشرفت بازیکن پاک نشود.
    // فایل کلید و رمزش را گیت‌هاب از بخش Secrets به اینجا می‌دهد.
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "kalame"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
            storeType "pkcs12"
        }
    }
    buildFeatures {
        aidl = true          // رابط پرداخت فروشگاه‌ها (src/main/aidl)
        buildConfig = true
    }
    // دو نسخه‌ی جدا از بازی: یکی برای کافه‌بازار و یکی برای مایکت.
    // کلید عمومی (RSA) هر فروشگاه را از پنل توسعه‌دهندگان همان فروشگاه بردارید و یا در Secrets گیت‌هاب
    // با نام‌های BAZAAR_RSA_KEY و MYKET_RSA_KEY بگذارید، یا در فایل android/gradle.properties
    // با نام‌های bazaarRsaKey و myketRsaKey. بدون کلید، فروشگاه سکه در بازی غیرفعال می‌ماند.
    flavorDimensions "store"
    productFlavors {
        bazaar {
            dimension "store"
            buildConfigField "String", "STORE_ID", '"bazaar"'
            buildConfigField "String", "STORE_NAME", '"کافه‌بازار"'
            buildConfigField "String", "STORE_PACKAGE", '"com.farsitel.bazaar"'
            buildConfigField "String", "STORE_BILLING_ACTION", '"ir.cafebazaar.pardakht.InAppBillingService.BIND"'
            buildConfigField "String", "STORE_RSA_KEY", '"' + storeKey("BAZAAR_RSA_KEY", "bazaarRsaKey") + '"'
        }
        myket {
            dimension "store"
            buildConfigField "String", "STORE_ID", '"myket"'
            buildConfigField "String", "STORE_NAME", '"مایکت"'
            buildConfigField "String", "STORE_PACKAGE", '"ir.mservices.market"'
            buildConfigField "String", "STORE_BILLING_ACTION", '"ir.mservices.market.InAppBillingService.BIND"'
            buildConfigField "String", "STORE_RSA_KEY", '"' + storeKey("MYKET_RSA_KEY", "myketRsaKey") + '"'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
