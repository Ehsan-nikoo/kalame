# دستورالعمل ساخت APK روی گیت‌هاب
# فقط وقتی اجرا می‌شود که در بخش Actions، دکمه‌ی Run workflow زده شود
# (فرستادن تغییرها به گیت‌هاب به‌تنهایی APK نمی‌سازد).
# گیت‌هاب بازی را به APK تبدیل می‌کند و آن را در بخش Releases می‌گذارد.
# دو APK ساخته می‌شود: یکی برای کافه‌بازار و یکی برای مایکت (هر کدام با پرداخت همان فروشگاه).
# کلید عمومی (RSA) هر فروشگاه را از پنل توسعه‌دهندگانش بردارید و در Secrets مخزن با نام‌های
# BAZAAR_RSA_KEY و MYKET_RSA_KEY بگذارید؛ بدون آن فروشگاه سکه در آن نسخه غیرفعال می‌ماند.

name: ساخت APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: گرفتن کد پروژه
        uses: actions/checkout@v5

      - name: آماده کردن Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: آماده کردن Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: گذاشتن کلید امضا
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::کلید امضا پیدا نشد. دو Secret به نام‌های KEYSTORE_BASE64 و KEYSTORE_PASSWORD را در تنظیمات مخزن اضافه کنید."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: بررسی کلیدهای عمومی بازار و مایکت
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: bash tools/check-store-keys.sh --strict

      - name: نصب ابزارهای پروژه
        run: npm ci

      - name: کپی بازی داخل پروژه‌ی اندروید
        run: npx cap sync android

      - name: ساخت APK (بازار و مایکت)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: |
          if [ -z "$BAZAAR_RSA_KEY" ]; then echo "::warning::BAZAAR_RSA_KEY تنظیم نشده؛ خرید سکه در نسخه‌ی بازار کار نمی‌کند."; fi
          if [ -z "$MYKET_RSA_KEY" ]; then echo "::warning::MYKET_RSA_KEY تنظیم نشده؛ خرید سکه در نسخه‌ی مایکت کار نمی‌کند."; fi
          chmod +x gradlew
          ./gradlew assembleBazaarRelease assembleMyketRelease --no-daemon
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk "../kalame-$VERSION-bazaar.apk"
          cp app/build/outputs/apk/myket/release/app-myket-release.apk "../kalame-$VERSION-myket.apk"

      - name: گذاشتن APK در Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "kalame-$VERSION-bazaar.apk" "kalame-$VERSION-myket.apk" \
            --title "کلمه $VERSION" \
            --notes "kalame-$VERSION-bazaar.apk برای انتشار در کافه‌بازار و kalame-$VERSION-myket.apk برای مایکت است. برای آزمایش روی گوشی هم هر کدام را می‌شود نصب کرد."
