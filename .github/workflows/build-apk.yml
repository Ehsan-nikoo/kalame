# دستورالعمل ساخت APK روی گیت‌هاب
# هر بار که تغییری روی شاخه‌ی main فرستاده شود (یا از بخش Actions دکمه‌ی Run workflow زده شود)،
# گیت‌هاب بازی را به APK تبدیل می‌کند و آن را در بخش Releases می‌گذارد.

name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: گرفتن کد پروژه
        uses: actions/checkout@v5

      - name: آماده کردن Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: آماده کردن Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: گذاشتن کلید امضا
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::کلید امضا پیدا نشد. دو Secret به نام‌های KEYSTORE_BASE64 و KEYSTORE_PASSWORD را در تنظیمات مخزن اضافه کنید."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: نصب ابزارهای پروژه
        run: npm ci

      - name: کپی بازی داخل پروژه‌ی اندروید
        run: npx cap sync android

      - name: ساخت APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../kalame-$VERSION.apk"

      - name: گذاشتن APK در Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "kalame-$VERSION.apk" \
            --title "کلمه $VERSION" \
            --notes "برای نصب، فایل kalame-$VERSION.apk را روی گوشی دانلود و باز کنید."
