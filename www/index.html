<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>کلمه</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes/stars.css">
  <link rel="stylesheet" href="themes/carpet.css">
  <link rel="stylesheet" href="themes/caravan.css">
  <link rel="stylesheet" href="themes/garden.css">
  <link rel="stylesheet" href="themes/ink.css">
</head>
<body>
  <!-- انتخاب ظاهر -->
  <section class="screen hidden" id="screenThemes">
    <header class="screen-top">
      <button class="icon-btn" id="themesBack" type="button" data-back aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="screen-title">ظاهر بازی رو انتخاب کن</h1>
    </header>
    <div class="theme-list" id="themeList"></div>
  </section>

  <!-- منوی اصلی -->
  <section class="screen hidden" id="screenHome">
    <div class="home-top">
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="تنظیمات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </div>
    <div class="home-scene" id="homeScene"></div>
    <h1 class="logo">کلمه</h1>
    <p class="home-sub" id="homeSub"></p>
    <nav class="home-menu">
      <button class="menu-btn primary" id="continueBtn" type="button">ادامه<small id="continueSub"></small></button>
      <button class="menu-btn" id="levelsBtn" type="button">مرحله‌ها</button>
      <button class="menu-btn" id="achBtn" type="button">دستاوردها<span class="badge hidden" id="achBadge"></span></button>
      <button class="menu-btn" id="themesBtn" type="button">ظاهر بازی</button>
      <button class="menu-btn hidden" id="shopBtn" type="button">فروشگاه سکه</button>
    </nav>
  </section>

  <!-- فهرست مرحله‌ها -->
  <section class="screen hidden" id="screenLevels">
    <header class="screen-top">
      <button class="icon-btn" type="button" data-back aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="screen-title">مرحله‌ها</h1>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </header>
    <div class="level-map" id="levelMap"></div>
  </section>

  <!-- دستاوردها -->
  <section class="screen hidden" id="screenAchievements">
    <header class="screen-top">
      <button class="icon-btn" type="button" data-back aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="screen-title">دستاوردها</h1>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </header>
    <div class="ach-list" id="achList"></div>
  </section>

  <!-- تنظیمات -->
  <section class="screen hidden" id="screenSettings">
    <header class="screen-top">
      <button class="icon-btn" type="button" data-back aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="screen-title">تنظیمات</h1>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </header>
    <div class="settings-list">
      <label class="setting">
        <span class="setting-name">صدا</span>
        <input type="checkbox" class="switch" id="setSound">
      </label>
      <label class="setting">
        <span class="setting-name">لرزش</span>
        <input type="checkbox" class="switch" id="setHaptics">
      </label>
      <div class="setting column">
        <span class="setting-name">اندازه‌ی متن</span>
        <div class="segmented" id="setText"></div>
      </div>
      <button class="setting setting-link" id="setTutorial" type="button">
        <span class="setting-name">دیدن دوباره‌ی آموزش</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- فروشگاه سکه (فقط در نسخه‌ی بازار و مایکت فعال است) -->
  <section class="screen hidden" id="screenShop">
    <header class="screen-top">
      <button class="icon-btn" type="button" data-back aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="screen-title">فروشگاه سکه</h1>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </header>
    <p class="shop-note hidden" id="shopNote"></p>
    <div class="ach-list" id="shopList"></div>
  </section>

  <!-- خود بازی -->
  <main class="screen hidden" id="app">
    <header class="top">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="منو">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn chest-btn" id="chestBtn" type="button" aria-label="صندوق کلمه‌ها">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z M3 11V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2 M10.5 10h3v4h-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <div class="level-label" id="levelLabel"></div>
      <div class="coins"><span class="coin-icon"></span><span class="coin-count">۰</span></div>
    </header>

    <section class="board-area">
      <div class="board" id="board"></div>
      <div class="praise" id="praise" aria-live="polite"></div>
    </section>

    <section class="play-area">
      <div class="preview" id="preview"></div>
      <div class="wheel" id="wheel">
        <svg class="wheel-lines" id="wheelLines"></svg>
      </div>
      <div class="tools">
        <button class="tool" id="hintWordBtn" type="button" aria-label="راهنما: یک کلمه">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5Z M12 6v13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="cost"><span class="coin-icon"></span><span class="cost-count"></span></span>
        </button>
        <button class="tool shuffle" id="shuffleBtn" type="button" aria-label="بُر زدن">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" id="hintLetterBtn" type="button" aria-label="راهنما: یک حرف">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="cost"><span class="coin-icon"></span><span class="cost-count"></span></span>
        </button>
      </div>
    </section>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <div class="card-title" id="overlayTitle"></div>
      <div class="card-text" id="overlayText"></div>
      <div class="reward" id="overlayReward"><span class="coin-icon"></span><span class="reward-count"></span></div>
      <button class="card-btn" id="overlayBtn" type="button"></button>
      <button class="card-link" id="overlayMenu" type="button">منو</button>
    </div>
  </div>

  <!-- کارت معنی کلمه (با زدن روی کلمه‌ی پیدا شده در جدول) -->
  <div class="sheet hidden" id="meaningSheet" role="dialog" aria-modal="true" aria-label="معنی کلمه">
    <div class="card sheet-card">
      <div id="meaningList"></div>
      <button class="card-btn" id="meaningClose" type="button">باشه</button>
    </div>
  </div>

  <!-- کارت مرحله‌ی رد شده (با زدن روی آن در نقشه‌ی مرحله‌ها): کلمه‌ها و معنی‌شان، و بازی دوباره -->
  <div class="sheet center hidden" id="levelSheet" role="dialog" aria-modal="true" aria-labelledby="levelSheetTitle">
    <div class="card sheet-card level-card">
      <div class="card-title" id="levelSheetTitle"></div>
      <div class="card-text" id="levelSheetSub"></div>
      <div class="level-words" id="levelWords"></div>
      <button class="card-btn" id="levelReplay" type="button">بازی دوباره</button>
      <button class="card-link" id="levelClose" type="button">بستن</button>
    </div>
  </div>

  <!-- صندوق کلمه‌ها: کلمه‌های درستی که در جدول نبودند -->
  <div class="sheet center hidden" id="chestSheet" role="dialog" aria-modal="true" aria-labelledby="chestTitle">
    <div class="card sheet-card level-card chest-card">
      <svg class="chest-art" id="chestArt" viewBox="0 0 120 92" aria-hidden="true">
        <defs>
          <linearGradient id="chWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chest-wood, #a8692f)"/><stop offset="1" stop-color="var(--chest-wood-2, #6e4220)"/></linearGradient>
          <linearGradient id="chLid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
          <linearGradient id="chMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6420"/><stop offset=".35" stop-color="#f6dc8e"/><stop offset=".6" stop-color="var(--chest-band, #e0b04a)"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
          <pattern id="chGrain" width="84" height="8" patternUnits="userSpaceOnUse"><path d="M0 2Q20 0 42 3T84 2M0 6Q30 4 50 7T84 5" stroke="#000" stroke-opacity=".14" stroke-width=".7" fill="none"/></pattern>
        </defs>
        <circle class="chest-glow" cx="60" cy="50" r="40"/>
        <ellipse cx="60" cy="86" rx="46" ry="4" fill="#000" opacity=".22"/>
        <rect x="18" y="44" width="84" height="40" rx="4" fill="url(#chWood)"/>
        <rect x="18" y="44" width="84" height="40" rx="4" fill="url(#chGrain)"/>
        <path d="M18 64H102M18 74H102" stroke="#000" stroke-opacity=".22" stroke-width=".8"/>
        <rect x="18" y="80" width="84" height="4" rx="2" fill="url(#chMetal)"/>
        <rect x="29" y="44" width="8" height="40" fill="url(#chMetal)"/><rect x="83" y="44" width="8" height="40" fill="url(#chMetal)"/>
        <g fill="#5a3a10" opacity=".7"><circle cx="33" cy="50" r="1.1"/><circle cx="33" cy="78" r="1.1"/><circle cx="87" cy="50" r="1.1"/><circle cx="87" cy="78" r="1.1"/></g>
        <g class="chest-lid">
          <path d="M18 46V32Q18 16 36 16H84Q102 16 102 32V46Z" fill="url(#chWood)"/>
          <path d="M18 46V32Q18 16 36 16H84Q102 16 102 32V46Z" fill="url(#chGrain)"/>
          <path d="M18 46V32Q18 16 36 16H84Q102 16 102 32V46Z" fill="url(#chLid)"/>
          <rect x="29" y="16.5" width="8" height="29.5" fill="url(#chMetal)"/><rect x="83" y="16.5" width="8" height="29.5" fill="url(#chMetal)"/>
          <rect x="18" y="41" width="84" height="5" fill="url(#chMetal)"/>
          <g fill="#5a3a10" opacity=".7"><circle cx="33" cy="22" r="1.1"/><circle cx="87" cy="22" r="1.1"/></g>
        </g>
        <path d="M52 40H68V52Q60 59 52 52Z" fill="url(#chMetal)" stroke="#5a3a10" stroke-width="1"/>
        <circle cx="60" cy="46" r="2.3" fill="#3a240c"/><path d="M59 47H61L61.6 52H58.4Z" fill="#3a240c"/>
      </svg>
      <div class="card-title" id="chestTitle">صندوق کلمه‌ها</div>
      <div class="card-text" id="chestText"></div>
      <div class="chest-bar"><span id="chestBarFill"></span><b id="chestBarText"></b></div>
      <div class="level-words" id="chestWords"></div>
      <button class="card-btn" id="chestOpen" type="button"></button>
      <button class="card-link" id="chestClose" type="button">بستن</button>
    </div>
  </div>

  <!-- جایزه‌ی روزانه (اولین بار هر روز که منو باز می‌شود) -->
  <div class="sheet center hidden" id="rewardSheet" role="dialog" aria-modal="true" aria-label="جایزه‌ی روزانه">
    <div class="card reward-card">
      <div class="card-title">جایزه‌ی روزانه</div>
      <div class="card-text" id="rewardText"></div>
      <div class="reward-days" id="rewardDays"></div>
      <button class="card-btn" id="rewardBtn" type="button"></button>
    </div>
  </div>

  <div class="error hidden" id="errorBox"></div>

  <script src="engine.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
  <script src="feel.js"></script>
  <script src="themes/stars.js"></script>
  <script src="themes/carpet.js"></script>
  <script src="themes/caravan-scenes.js"></script>
  <script src="themes/caravan.js"></script>
  <script src="themes/garden.js"></script>
  <script src="themes/ink.js"></script>
</body>
</html>
