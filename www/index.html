<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>کلمه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <h1 class="title">کلمه</h1>
      <div class="level-label" id="levelLabel">مرحله‌ی ۱</div>
    </header>

    <section class="board-area">
      <div class="board" id="board"></div>
    </section>

    <section class="play-area">
      <div class="preview" id="preview"></div>
      <div class="wheel" id="wheel">
        <svg class="wheel-lines" id="wheelLines"></svg>
      </div>
      <button class="shuffle" id="shuffleBtn" type="button" aria-label="بُر زدن">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>بُر زدن</span>
      </button>
    </section>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <div class="card-title" id="overlayTitle"></div>
      <div class="card-text" id="overlayText"></div>
      <button class="card-btn" id="overlayBtn" type="button"></button>
    </div>
  </div>

  <div class="error hidden" id="errorBox"></div>

  <script src="game.js"></script>
</body>
</html>
